<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Camera Receiver</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #0f172a; color: #fff; padding-top: 30px; margin: 0; }
    #video { width: 90%; max-width: 850px; display: none; margin: 15px auto; border-radius: 12px; border: 2px solid #38bdf8; background: #000; }
    #session-box { background: #1e293b; display: inline-block; padding: 25px; border-radius: 12px; border: 1px solid #334155; margin-top: 20px; }
    #qrcode-img { background: #fff; padding: 10px; border-radius: 8px; display: block; margin: 0 auto 15px auto; }
    .btn { padding: 12px 24px; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
    .btn:hover { background: #0369a1; }
    .link-text { color: #38bdf8; font-size: 14px; word-break: break-all; margin-top: 10px; display: block; }
  </style>
</head>
<body>
  <h2>Phone Live Camera Stream</h2>
  
  <div id="session-box">
    <img id="qrcode-img" src="" alt="QR Code" width="200" height="200" />
    <p style="color: #cbd5e1; margin: 5px 0;">Scan QR with phone camera</p>
    <a id="direct-link" class="link-text" target="_blank"></a>
  </div>

  <div>
    <video id="video" autoplay playsinline controls></video><br>
    <button id="switch-btn" class="btn" style="display:none;" onclick="switchPhoneCamera()">🔄 Switch Phone Camera (Front / Back)</button>
  </div>

  <script>
    const socket = io();
    const sessionId = Math.random().toString(36).substring(2, 9);
    const clientUrl = window.location.origin + '/client.html?session=' + sessionId;

    document.getElementById("qrcode-img").src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(clientUrl);
    const linkEl = document.getElementById("direct-link");
    linkEl.href = clientUrl;
    linkEl.innerText = "Or open manually: " + clientUrl;

    socket.emit('create-session', sessionId);

    let peerConnection;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    socket.on('client-connected', () => {
      peerConnection = new RTCPeerConnection(config);

      peerConnection.ontrack = (event) => {
        document.getElementById('session-box').style.display = 'none';
        const video = document.getElementById('video');
        video.style.display = 'block';
        video.srcObject = event.streams[0];
        document.getElementById('switch-btn').style.display = 'inline-block';
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) socket.emit('signal', { sessionId, data: { candidate: event.candidate } });
      };
    });

    socket.on('signal', async (data) => {
      if (data.offer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('signal', { sessionId, data: { answer } });
      } else if (data.candidate && peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    function switchPhoneCamera() {
      socket.emit('switch-camera-request', sessionId);
    }
  </script>
</body>
</html>
