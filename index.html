<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Receiver Screen</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; padding-top: 40px; }
    #video { width: 80%; max-width: 900px; display: none; margin: 20px auto; border-radius: 8px; }
    #qrcode-img { background: #fff; padding: 12px; border-radius: 8px; margin-top: 15px; }
    .link-text { color: #4da3ff; word-break: break-all; margin-top: 15px; display: block; text-decoration: none; }
  </style>
</head>
<body>
  <h2>Phone Live Screen / Camera</h2>
  
  <div id="session-box">
    <img id="qrcode-img" src="" alt="QR Code" width="220" height="220" />
    <p>Scan this QR with phone (Valid for 10 mins)</p>
    <a id="direct-link" class="link-text" target="_blank"></a>
  </div>

  <video id="video" autoplay playsinline controls></video>

  <script>
    const socket = io();
    const sessionId = Math.random().toString(36).substring(2, 9);
    const clientUrl = `${window.location.origin}/client.html?session=${sessionId}`;

    // Direct Google QR API to avoid external library issues
    document.getElementById("qrcode-img").src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(clientUrl)}`;
    const directLink = document.getElementById("direct-link");
    directLink.href = clientUrl;
    directLink.innerText = "Or open manually: " + clientUrl;

    socket.emit('create-session', sessionId);

    let peerConnection;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    socket.on('client-connected', async () => {
      peerConnection = new RTCPeerConnection(config);

      peerConnection.ontrack = (event) => {
        document.getElementById('session-box').style.display = 'none';
        const video = document.getElementById('video');
        video.style.display = 'block';
        video.srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('signal', { sessionId, data: { candidate: event.candidate } });
        }
      };
    });

    socket.on('signal', async (data) => {
      if (data.offer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('signal', { sessionId, data: { answer } });
      } else if (data.candidate && peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    socket.on('session-expired', () => alert('Session expired! Please refresh.'));
  </script>
</body>
</html>
