<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dual Stream Receiver</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #0b0f19; color: #fff; margin: 0; padding: 20px; }
    #session-box { background: #1e293b; display: inline-block; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-top: 20px; }
    #qrcode-img { background: #fff; padding: 10px; border-radius: 8px; margin: 0 auto; display: block; }
    .stream-container { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 20px; }
    .video-box { width: 90%; max-width: 850px; background: #000; border-radius: 10px; border: 2px solid #38bdf8; overflow: hidden; }
    video { width: 100%; height: auto; display: block; }
    .label { padding: 8px; background: #1e293b; font-weight: bold; color: #38bdf8; text-align: left; }
    .btn { padding: 12px 24px; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-bottom: 10px; }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <h2>Live Mobile Camera & Screen Dual View</h2>
  
  <div id="session-box">
    <img id="qrcode-img" src="" alt="QR Code" width="200" height="200" />
    <p style="color: #cbd5e1; margin-top: 10px;">Scan QR with phone</p>
  </div>

  <div id="controls-panel" style="display: none;">
    <button class="btn" onclick="switchCamera()">🔄 Switch Phone Camera (Front / Back)</button>
  </div>

  <div class="stream-container" id="streams" style="display: none;">
    <!-- 1. Top Screen: Camera -->
    <div class="video-box">
      <div class="label">📷 Live Camera (Front / Back)</div>
      <video id="cameraVideo" autoplay playsinline controls></video>
    </div>

    <!-- 2. Bottom Screen: Screen Share -->
    <div class="video-box">
      <div class="label">📱 Live Phone Screen</div>
      <video id="screenVideo" autoplay playsinline controls></video>
    </div>
  </div>

  <script>
    const socket = io();
    const sessionId = Math.random().toString(36).substring(2, 9);
    const clientUrl = window.location.origin + '/client.html?session=' + sessionId;

    document.getElementById("qrcode-img").src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(clientUrl);
    socket.emit('create-session', sessionId);

    let peerConnection;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    socket.on('client-connected', () => {
      peerConnection = new RTCPeerConnection(config);

      peerConnection.ontrack = (event) => {
        document.getElementById('session-box').style.display = 'none';
        document.getElementById('controls-panel').style.display = 'block';
        document.getElementById('streams').style.display = 'flex';

        // Direct streams by track kinds / stream IDs
        if (event.streams.length > 0) {
          const stream = event.streams[0];
          const camVideo = document.getElementById('cameraVideo');
          const scrVideo = document.getElementById('screenVideo');

          if (!camVideo.srcObject) {
            camVideo.srcObject = stream;
          } else if (!scrVideo.srcObject && camVideo.srcObject.id !== stream.id) {
            scrVideo.srcObject = stream;
          }
        }
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) socket.emit('signal', { sessionId, data: { candidate: event.candidate } });
      };
    });

    socket.on('signal', async (data) => {
      if (data.offer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('signal', { sessionId, data: { answer } });
      } else if (data.candidate && peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    function switchCamera() {
      socket.emit('switch-camera-request', sessionId);
    }
  </script>
</body>
</html>
