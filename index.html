<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Receiver Screen</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; padding-top: 30px; }
    #video { width: 85%; max-width: 900px; display: none; margin: 20px auto; border-radius: 8px; }
    #session-box { background: #1e1e1e; display: inline-block; padding: 25px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; }
    #qrcode-img { background: #fff; padding: 10px; border-radius: 8px; display: block; margin: 0 auto 15px auto; }
    .link-btn { display: inline-block; padding: 10px 20px; background: #0070f3; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; word-break: break-all; }
  </style>
</head>
<body>
  <h2>Phone Live Screen / Camera</h2>
  
  <div id="session-box">
    <img id="qrcode-img" src="" alt="Loading QR..." width="200" height="200" />
    <p style="color: #aaa; margin: 10px 0;">Scan this QR with phone camera</p>
    <p style="margin: 5px 0;">Or open this link on your phone:</p>
    <a id="direct-link" class="link-btn" target="_blank">Loading Link...</a>
  </div>

  <video id="video" autoplay playsinline controls></video>

  <script>
    const socket = io();
    const sessionId = Math.random().toString(36).substring(2, 9);
    const clientUrl = window.location.origin + '/client.html?session=' + sessionId;

    // Direct Image URL for QR Code
    document.getElementById("qrcode-img").src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(clientUrl);
    
    const linkEl = document.getElementById("direct-link");
    linkEl.href = clientUrl;
    linkEl.innerText = clientUrl;

    socket.emit('create-session', sessionId);

    let peerConnection;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    socket.on('client-connected', async () => {
      peerConnection = new RTCPeerConnection(config);

      peerConnection.ontrack = (event) => {
        document.getElementById('session-box').style.display = 'none';
        const video = document.getElementById('video');
        video.style.display = 'block';
        video.srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('signal', { sessionId, data: { candidate: event.candidate } });
        }
      };
    });

    socket.on('signal', async (data) => {
      if (data.offer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('signal', { sessionId, data: { answer } });
      } else if (data.candidate && peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    socket.on('session-expired', () => alert('Session expired! Please refresh.'));
  </script>
</body>
</html>
