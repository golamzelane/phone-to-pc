<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌊 Captain’s Multi-Stream Receiver</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #031322; color: #e0f2fe; padding: 20px 0; margin: 0; }
    #session-box { background: #07223d; display: inline-block; padding: 20px; border-radius: 12px; border: 1px solid #0284c7; margin-top: 15px; }
    #qrcode-img { background: #fff; padding: 8px; border-radius: 8px; margin-bottom: 10px; }
    .stream-container { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 20px; }
    .stream-card { width: 90%; max-width: 800px; background: #07223d; border: 2px solid #0284c7; border-radius: 12px; padding: 15px; box-sizing: border-box; }
    .stream-card h3 { margin: 0 0 10px 0; color: #38bdf8; font-size: 18px; }
    .video-box { width: 100%; height: 350px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; display: none; }
    .placeholder { color: #94a3b8; font-size: 15px; font-weight: bold; }
    .audio-status { padding: 15px; border-radius: 8px; background: #0b2942; color: #94a3b8; font-size: 15px; }
    .active-status { color: #4ade80 !important; font-weight: bold; }
    .btn { padding: 10px 20px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>⚓ Captain’s Multi-Stream View</h2>

  <div id="session-box">
    <img id="qrcode-img" src="" width="180" height="180" alt="Session QR" />
    <p style="margin: 0; color: #7dd3fc; font-size: 14px;">Scan or open direct portal link</p>
    <a id="direct-link" style="color:#38bdf8; word-break: break-all; font-size: 13px;" target="_blank">Loading link...</a>
  </div>

  <div class="stream-container">
    <!-- Layer 1: Camera View -->
    <div class="stream-card">
      <h3>📷 Layer 1: Camera View</h3>
      <div class="video-box">
        <video id="camera-video" autoplay playsinline muted controls></video>
        <span id="camera-placeholder" class="placeholder">❌ Camera stream not received</span>
      </div>
      <button id="switch-btn" class="btn" style="display:none;" onclick="switchCamera()">🔄 Switch Camera</button>
    </div>

    <!-- Layer 2: Screen View -->
    <div class="stream-card">
      <h3>🖥️ Layer 2: Screen View</h3>
      <div class="video-box">
        <video id="screen-video" autoplay playsinline muted controls></video>
        <span id="screen-placeholder" class="placeholder">❌ Screen sharing not started</span>
      </div>
    </div>

    <!-- Layer 3: Audio / Mic View -->
    <div class="stream-card">
      <h3>🎙️ Layer 3: Microphone Status</h3>
      <div id="mic-status" class="audio-status">❌ Microphone not connected</div>
      <audio id="remote-audio" autoplay></audio>
    </div>
  </div>

  <script>
    const socket = io();
    const sessionId = Math.random().toString(36).substring(2, 9);
    const clientUrl = window.location.origin + '/client.html?session=' + sessionId;

    document.getElementById("qrcode-img").src = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" + encodeURIComponent(clientUrl);
    const linkEl = document.getElementById("direct-link");
    linkEl.href = clientUrl;
    linkEl.innerText = clientUrl;

    socket.emit('create-session', sessionId);

    let peerConnection;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

    function initPC() {
      if (peerConnection) return;
      peerConnection = new RTCPeerConnection(config);

      peerConnection.ontrack = (event) => {
        // Hide QR Code box as soon as stream tracks start arriving
        document.getElementById('session-box').style.display = 'none';

        const stream = event.streams[0];
        const track = event.track;

        if (track.kind === 'video') {
          if (track.label.toLowerCase().includes('screen') || track.label.toLowerCase().includes('display')) {
            const v = document.getElementById('screen-video');
            v.srcObject = stream;
            v.style.display = 'block';
            document.getElementById('screen-placeholder').style.display = 'none';
          } else {
            const v = document.getElementById('camera-video');
            v.srcObject = stream;
            v.style.display = 'block';
            document.getElementById('camera-placeholder').style.display = 'none';
            document.getElementById('switch-btn').style.display = 'inline-block';
          }
        }

        if (track.kind === 'audio') {
          const a = document.getElementById('remote-audio');
          a.srcObject = stream;
          const mic = document.getElementById('mic-status');
          mic.innerText = '🟢 Microphone Active & Streaming';
          mic.classList.add('active-status');
        }
      };

      peerConnection.onicecandidate = (e) => {
        if (e.candidate) socket.emit('signal', { sessionId, data: { candidate: e.candidate } });
      };
    }

    socket.on('client-connected', () => initPC());

    socket.on('signal', async (data) => {
      if (!peerConnection) initPC();
      if (data.offer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('signal', { sessionId, data: { answer } });
      } else if (data.candidate) {
        try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) {}
      }
    });

    function switchCamera() {
      socket.emit('switch-camera-request', sessionId);
    }
  </script>
</body>
</html>
