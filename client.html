<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Sea Streamer</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #031322; color: #e0f2fe; padding-top: 40px; margin: 0; }
    button { padding: 14px 24px; font-size: 16px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 10px; width: 80%; max-width: 320px; }
    .status { margin-top: 15px; font-size: 14px; color: #7dd3fc; }
  </style>
</head>
<body>
  <h2>Deep Sea Broadcaster</h2>

  <button id="start-cam-btn" onclick="requestCameraAndMic()">📷 Connect Camera & Mic</button><br>
  <button id="start-screen-btn" onclick="requestScreenShare()">🖥️ Share Screen</button>

  <p id="status" class="status">Click buttons to grant permissions</p>

  <script>
    const socket = io();
    const sessionId = new URLSearchParams(window.location.search).get('session');
    let peerConnection;
    let cameraStream, screenStream;
    let useFront = false;

    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    if (sessionId) socket.emit('join-session', sessionId);

    function initPC() {
      if (peerConnection) return;
      peerConnection = new RTCPeerConnection(config);

      peerConnection.onicecandidate = (e) => {
        if (e.candidate) socket.emit('signal', { sessionId, data: { candidate: e.candidate } });
      };
    }

    async function sendOffer() {
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('signal', { sessionId, data: { offer } });
    }

    async function requestCameraAndMic() {
      initPC();
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: useFront ? "user" : "environment" },
          audio: true
        });
      } catch (e) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        } catch (err) {}
      }

      if (cameraStream) {
        cameraStream.getTracks().forEach(track => peerConnection.addTrack(track, cameraStream));
        await sendOffer();
        document.getElementById('start-cam-btn').style.display = 'none';
        document.getElementById('status').innerText = 'Camera & Mic Connected!';
      }
    }

    async function requestScreenShare() {
      initPC();
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        screenStream.getTracks().forEach(track => peerConnection.addTrack(track, screenStream));
        await sendOffer();
        document.getElementById('start-screen-btn').style.display = 'none';
        document.getElementById('status').innerText = 'Screen Share Active!';
      } catch (err) {
        document.getElementById('status').innerText = 'Screen sharing cancelled.';
      }
    }

    socket.on('signal', async (data) => {
      if (data.answer && peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      if (data.candidate && peerConnection) try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
    });
  </script>
</body>
</html>
