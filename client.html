<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Camera</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #0f172a; color: #fff; padding-top: 60px; margin: 0; }
    #status { font-size: 18px; color: #38bdf8; margin-top: 25px; }
    button { padding: 16px 32px; font-size: 18px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: bold; width: 80%; max-width: 320px; }
  </style>
</head>
<body>
  <h2>Camera Streamer</h2>
  <button id="start-btn" onclick="startCamera()">📷 Start Streaming</button>
  <p id="status">Tap the button above to begin stream</p>

  <script>
    const socket = io();
    const sessionId = new URLSearchParams(window.location.search).get('session');
    const statusEl = document.getElementById('status');
    let peerConnection, currentStream;
    let currentFacing = 'environment'; // Default back camera

    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    if (sessionId) {
      socket.emit('join-session', sessionId);
    } else {
      statusEl.innerText = '❌ Invalid session URL';
    }

    async function getCameraStream(facingMode) {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      return await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: facingMode } },
        audio: false
      }).catch(() => {
        // Fallback if exact facingMode fails
        return navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode },
          audio: false
        });
      });
    }

    async function startCamera() {
      try {
        currentStream = await getCameraStream(currentFacing);
        peerConnection = new RTCPeerConnection(config);

        currentStream.getTracks().forEach(track => peerConnection.addTrack(track, currentStream));

        peerConnection.onicecandidate = (e) => {
          if (e.candidate) socket.emit('signal', { sessionId, data: { candidate: e.candidate } });
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('signal', { sessionId, data: { offer } });

        statusEl.innerText = '🔴 Streaming live to PC... (Keep this tab open)';
        document.getElementById('start-btn').style.display = 'none';
      } catch (err) {
        alert('Camera Error: ' + err.message);
        statusEl.innerText = '⚠️ Error: ' + err.message;
      }
    }

    // Remote Camera Switch triggered from PC
    socket.on('switch-camera', async () => {
      currentFacing = (currentFacing === 'environment') ? 'user' : 'environment';
      try {
        currentStream = await getCameraStream(currentFacing);
        const newTrack = currentStream.getVideoTracks()[0];
        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) {
          await sender.replaceTrack(newTrack);
        }
      } catch (e) {
        console.error('Camera switch failed:', e);
      }
    });

    socket.on('signal', async (data) => {
      if (data.answer && peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      } else if (data.candidate && peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });
  </script>
</body>
</html>
